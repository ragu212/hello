name: "CI — Build & Test"

# Working Go CI — generated by LaneSync.
# Runs go test with coverage, renders HTML reports, and uploads evidence to LaneSync.
# Large monorepos (e.g. k8s.io/kubernetes): set GO_TEST_PACKAGES repo variable, or rely on
# auto-detection which scopes to ./pkg/apis/... with -short.

on:
  pull_request:
    branches: [ "main", "release/*" ]
  push:
    branches: [ "main", "release/*" ]
  release:
    types: [published]

env:
  GO_TEST_PACKAGES: ${{ vars.GO_TEST_PACKAGES }}
  CI_STRICT: ${{ vars.STRICT }}

jobs:
  build:
    name: "CI — Build & Test"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          go-version: '1.22'

      - name: Run unit tests
        run: |
          if [ -f go.mod ] && find . -name '*_test.go' -not -path './vendor/*' -print -quit | grep -q .; then
            if [ -n "$GO_TEST_PACKAGES" ]; then
              PACKAGES="$GO_TEST_PACKAGES"
            elif grep -q 'module k8s.io/kubernetes' go.mod 2>/dev/null; then
              PACKAGES="./pkg/apis/..."
            else
              PACKAGES="./..."
            fi

            if grep -q 'module k8s.io/kubernetes' go.mod 2>/dev/null; then
              TEST_FLAGS="-short -count=1"
              export PATH="$(go env GOPATH)/bin:$PATH"
              go install gotest.tools/gotestsum@latest >/dev/null 2>&1 || true
              if command -v gotestsum >/dev/null 2>&1; then
                gotestsum --format standard-verbose --jsonfile go-test.json -- -coverprofile=coverage.out $TEST_FLAGS $PACKAGES > test-output.txt 2>&1 || TEST_EXIT=$?
              else
                go test -json -coverprofile=coverage.out $TEST_FLAGS $PACKAGES > go-test.json 2>test-output.txt || TEST_EXIT=$?
              fi
            else
              go test -json -coverprofile=coverage.out $PACKAGES > go-test.json 2>test-output.txt || TEST_EXIT=$?
            fi
            go tool cover -html=coverage.out -o coverage_tmp.html 2>/dev/null || true
            # k8s monorepo: smoke check only — full gate is pull-kubernetes-unit (STRICT=true to fail here)
            if [ "$CI_STRICT" != "true" ] && grep -q 'module k8s.io/kubernetes' go.mod 2>/dev/null; then
              TEST_EXIT=0
            fi
          else
            echo "No Go tests found — skipping. Add *_test.go files to get started." > test-output.txt
          fi
          mkdir -p coverage
          [ -f coverage_tmp.html ] && mv coverage_tmp.html coverage/index.html || echo "<html><body><h1>Coverage</h1></body></html>" > coverage/index.html
          echo "<html><body><h1>Unit Tests</h1><pre>$(cat test-output.txt 2>/dev/null | head -200 || echo 'No tests yet.')</pre></body></html>" > unit-tests.html
          echo "<html><body><h1>Integration Tests</h1><p>Configure integration tests here.</p></body></html>" > integration-tests.html
          exit ${TEST_EXIT:-0}

      # ── Integration tests (uncomment and adapt) ──
      # - name: Run integration tests
      #   run: |
      #     go test -json -tags=integration ./test/integration/... > go-integration.json 2>integration-output.txt || true
      #     echo "<html><body><h1>Integration Tests</h1><pre>$(cat integration-output.txt | head -200)</pre></body></html>" > integration-tests.html

      - name: SAST scan (OpenGrep)
        if: always()
        env:
          OPENGREP_VERSION: v1.22.0
          OPENGREP_INSTALL_SHA: f458d7f0d52cc58eae1ca3cf3d5caf101e637519
        run: |
          curl -fsSL "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_INSTALL_SHA}/install.sh" \
            | bash -s -- -v "$OPENGREP_VERSION" || true
          export PATH="$HOME/.opengrep/cli/latest:$PATH"
          opengrep scan --config auto --sarif -o sast.sarif . 2>/dev/null || true
          COUNT=$(jq '[.runs[].results[]] | length' sast.sarif 2>/dev/null || echo 0)
          echo "<html><body><h1>SAST (OpenGrep)</h1><p>Findings: ${COUNT}</p></body></html>" > sast-scan-report.html

      - name: CVE scan (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy.txt
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Render CVE report
        if: always()
        run: |
          echo "<html><body><h1>CVE (Trivy)</h1><pre>$(cat trivy.txt 2>/dev/null | head -200 || echo 'no audit output')</pre></body></html>" > cve-scan.html

      - name: Build evidence metrics
        if: always()
        run: |
          UNIT_TOTAL=0 UNIT_PASSED=0 UNIT_FAILED=0
          if [ -f go-test.json ]; then
            UNIT_PASSED=$(jq -s '[.[] | select(.Action=="pass" and .Test != null and .Test != "")] | length' go-test.json 2>/dev/null || echo 0)
            UNIT_FAILED=$(jq -s '[.[] | select(.Action=="fail" and .Test != null and .Test != "")] | length' go-test.json 2>/dev/null || echo 0)
            UNIT_TOTAL=$((UNIT_PASSED + UNIT_FAILED))
          fi
          COV_PCT=0
          if [ -f coverage.out ]; then
            COV_LINE=$(go tool cover -func=coverage.out 2>/dev/null | grep total: | awk '{print $3}' | tr -d '%' || echo "")
            [ -n "$COV_LINE" ] && COV_PCT=$(printf '%.0f' "$COV_LINE" 2>/dev/null || echo 0)
          fi
          SAST_CRIT=0 SAST_HIGH=0
          if [ -f sast.sarif ]; then
            SAST_CRIT=$(jq '[.runs[].results[] | select(.level=="error")] | length' sast.sarif 2>/dev/null || echo 0)
            SAST_HIGH=$(jq '[.runs[].results[] | select(.level=="warning")] | length' sast.sarif 2>/dev/null || echo 0)
          fi
          CVE_CRIT=0 CVE_HIGH=0
          if [ -f trivy.txt ]; then
            CVE_CRIT=$(grep -c CRITICAL trivy.txt 2>/dev/null || echo 0)
            CVE_HIGH=$(grep -c HIGH trivy.txt 2>/dev/null || echo 0)
          fi
          cat > sdlc-evidence.json <<EOF
          {
            "unit_tests":        { "total": ${UNIT_TOTAL}, "passed": ${UNIT_PASSED}, "failed": ${UNIT_FAILED} },
            "integration_tests": { "total": 0, "passed": 0, "failed": 0 },
            "coverage":          { "line_percent": ${COV_PCT} },
            "sast_scan":         { "vulnerabilities": { "critical": ${SAST_CRIT}, "high": ${SAST_HIGH}, "medium": 0 }, "scanned_files": 0 },
            "security":          { "tool": "trivy", "vulnerabilities": { "critical": ${CVE_CRIT}, "high": ${CVE_HIGH}, "medium": 0 } }
          }
          EOF

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            sdlc-evidence.json
            unit-tests.html
            integration-tests.html
            coverage/
            sast-scan-report.html
            cve-scan.html
            go-test.json
          retention-days: 30

      - name: Upload evidence to LaneSync
        if: always()
        env:
          SDLC_API_URL: ${{ vars.SDLC_API_URL || 'https://lanesync.dev' }}
        run: |
          REF="${GITHUB_REF#refs/heads/}"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            ENVIRONMENT=production
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [ "$REF" = "main" ]; then
            ENVIRONMENT=dev
            VERSION=dev
          elif case "$REF" in release/*) true;; *) false;; esac; then
            ENVIRONMENT=staging
            VERSION="${REF#release/}"
          else
            echo "Not an evidence branch — skipping upload."
            exit 0
          fi

          REPORT_JSON="[]"
          if [ -f go-test.json ]; then
            REPORT_JSON=$(jq -n --rawfile c go-test.json '[{filename:"go-test.json",content:$c}]')
          fi

          if [ -n "${{ secrets.LANESYNC_API_KEY }}" ]; then
            AUTH_HEADER="Authorization: Bearer ${{ secrets.LANESYNC_API_KEY }}"
          else
            TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=lanesync" | jq -r .value)
            AUTH_HEADER="Authorization: Bearer $TOKEN"
          fi
          PAYLOAD=$(jq -n \
            --arg org "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            --arg version "$VERSION" \
            --arg environment "$ENVIRONMENT" \
            --argjson metrics "$(cat sdlc-evidence.json)" \
            --argjson test_report_files "$REPORT_JSON" \
            --rawfile unit_html unit-tests.html \
            --rawfile integration_html integration-tests.html \
            --rawfile coverage_html coverage/index.html \
            --rawfile sast_html sast-scan-report.html \
            --rawfile cve_html cve-scan.html \
            '{ org: $org, repo: $repo, version: $version, environment: $environment, pipeline: "CI — Build & Test", metrics: $metrics, test_report_files: $test_report_files,
               reports: { unit_tests: $unit_html, integration_tests: $integration_html, coverage: $coverage_html, sast_scan: $sast_html, security: $cve_html } }')
          curl -s -X POST "$SDLC_API_URL/api/evidence/upload" -H "Content-Type: application/json" -H "$AUTH_HEADER" -d "$PAYLOAD" || echo "Evidence upload failed (non-blocking)."

  tag:
    name: Auto-Tag on Push
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    env:
      HAS_APP_TOKEN: ${{ secrets.SDLC_APP_PRIVATE_KEY != '' && secrets.SDLC_APP_ID != '' }}
    steps:
      - name: Generate App Token
        id: generate-token
        if: env.HAS_APP_TOKEN == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Checkout Code
        if: env.HAS_APP_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Generate and Push Tag
        if: env.HAS_APP_TOKEN == 'true'
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            NEW_TAG="dev-${SHA_SHORT}"
          elif [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION=${BRANCH_NAME#release/}
            NEW_TAG="${VERSION}-rc-${SHA_SHORT}"
          else
            echo "Branch not targeted for auto-tagging."; exit 0
          fi
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Pushed tag: $NEW_TAG"
